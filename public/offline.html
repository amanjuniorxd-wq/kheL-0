<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sahayata — Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f9fafb;
      color: #1c1c1c;
      text-align: center;
      padding: 24px;
    }
    .card { max-width: 360px; }
    h1 { font-size: 1.25rem; margin-bottom: 8px; color: #124d3a; }
    p { color: #555; font-size: 0.9rem; line-height: 1.5; }
    button {
      margin-top: 16px;
      padding: 10px 20px;
      background: #1f7a5c;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>
      Sahayata needs a connection to show live requests, balances, and
      ledger activity. Reconnect and try again.
    </p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
