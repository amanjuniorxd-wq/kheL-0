<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Sahayata — Not configured</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f9fafb;
      color: #1c1c1c;
      text-align: center;
      padding: 24px;
    }
    .card { max-width: 420px; }
    h1 { font-size: 1.2rem; margin-bottom: 8px; color: #124d3a; }
    p { color: #555; font-size: 0.9rem; line-height: 1.6; }
    code {
      background: #eef0ee;
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 0.85em;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sahayata desktop isn't pointed anywhere yet</h1>
    <p>
      Edit <code>desktop/config.json</code> and set <code>"url"</code> to your
      deployed Sahayata site (e.g. <code>https://sahayata-yourname.vercel.app</code>),
      then rebuild the app.
    </p>
  </div>
</body>
</html>
